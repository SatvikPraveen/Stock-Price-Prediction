name: R package CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: R CMD check + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::lintr
          needs: check

      - name: Lint
        if: runner.os == 'Linux'
        run: lintr::lint_package()
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-snapshots: true

  smoke-experiment:
    name: Smoke experiment (quick config)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
      - name: Install the package so parallel workers can load it
        run: R CMD INSTALL --no-multiarch --no-docs .
      - name: Run the quick experiment on the pinned snapshot
        run: Rscript scripts/run_experiment.R config/quick.yml --run-id ci-smoke
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: smoke-experiment
          path: results/runs/ci-smoke
          retention-days: 14
