name: R Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R package dependencies
        run: source("dependencies.R")
        shell: Rscript {0}

      - name: Run tests
        run: testthat::test_dir("tests/testthat", reporter = "summary")
        shell: Rscript {0}
