name: Deploy Shiny app

on:
  workflow_run:
    workflows: ["R package CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to shinyapps.io
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify shinyapps.io secrets are configured
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          missing=""
          [ -z "$SHINYAPPS_ACCOUNT" ] && missing="$missing SHINYAPPS_ACCOUNT"
          [ -z "$SHINYAPPS_TOKEN" ] && missing="$missing SHINYAPPS_TOKEN"
          [ -z "$SHINYAPPS_SECRET" ] && missing="$missing SHINYAPPS_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repo secret(s):$missing - add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rsconnect, any::shiny, any::bslib, any::dygraphs, any::DT, any::cpp11, any::RcppArmadillo, any::RcppEigen

      # The app is self-contained: package code, the pinned data snapshot and
      # the latest experiment tables are copied into the app bundle.
      - name: Bundle package code, data snapshot and results into the app
        run: |
          rm -rf shiny_app/R shiny_app/data shiny_app/results
          cp -r R shiny_app/R
          mkdir -p shiny_app/data shiny_app/results
          cp -r data/snapshot shiny_app/data/snapshot
          cp -r results/latest shiny_app/results/latest

      - name: Deploy
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          rsconnect::setAccountInfo(
            name = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )
          rsconnect::deployApp(appDir = "shiny_app", appName = "stockcast", forceUpdate = TRUE)
        shell: Rscript {0}
